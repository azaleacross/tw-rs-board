<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS7 趨勢策略</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--line:#e5e5ea;--up:#d70015;--dn:#248a3d;--acc:#0a66c2;--warn:#b25000;--hover:#f0f0f2}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111214;--card:#1b1c1f;--ink:#f2f2f4;--mut:#9a9aa1;--line:#2c2d31;--up:#ff6961;--dn:#4cd964;--acc:#5aa9ff;--warn:#ffb340;--hover:#24252a}}
:root[data-theme="dark"]{--bg:#111214;--card:#1b1c1f;--ink:#f2f2f4;--mut:#9a9aa1;--line:#2c2d31;--up:#ff6961;--dn:#4cd964;--acc:#5aa9ff;--warn:#ffb340;--hover:#24252a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:12px;height:52px}
header a{color:var(--acc);text-decoration:none;font-size:14px}
h1{font-size:17px;margin:0;font-weight:600}
h2{font-size:16px;margin:24px 0 8px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--hover);color:var(--mut)}
.pill.ok{color:var(--dn)}.pill.no{color:var(--warn)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card span{display:block;font-size:12px;color:var(--mut)}.card b{font-size:18px;font-variant-numeric:tabular-nums}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:500}
th.l,td.l{text-align:left}
tr:last-child td{border-bottom:0}
td .s{display:block;font-size:12px;color:var(--mut)}
.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn);font-weight:600}
.empty{padding:16px;color:var(--mut)}
.help{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 16px 12px;font-size:14px}
.help dt{font-weight:600;margin-top:10px}.help dd{margin:2px 0 0;color:var(--mut)}
footer{color:var(--mut);font-size:12px;margin:24px 0 40px}
</style>
</head>
<body>
<header><div class="wrap"><a href="index.html">← RS 雷達</a><h1>CS7 趨勢策略</h1><span class="pill" id="sys"></span><span class="pill" id="date"></span></div></header>
<main class="wrap">
  <div class="cards" id="cards"></div>
  <h2 id="buyTitle">明天開盤買</h2>
  <div class="tbl"><table><thead><tr><th class="l">股票</th><th class="l">產業</th><th>季 RS</th><th>收盤</th><th>1R</th><th>停損（估）</th><th>建議股數</th><th>月營收年增</th><th class="l">狀態</th></tr></thead><tbody id="sig"></tbody></table></div>
  <h2>模擬持股</h2>
  <div class="tbl"><table><thead><tr><th class="l">股票</th><th>進場日</th><th>進場價</th><th>股數</th><th>收盤</th><th>停損價</th><th>R 倍數</th><th>損益</th><th>天數</th><th class="l">明天</th></tr></thead><tbody id="pos"></tbody></table></div>
  <h2>最近出場</h2>
  <div class="tbl"><table><thead><tr><th class="l">股票</th><th>進場日</th><th>出場日</th><th>R 倍數</th><th>損益（元）</th><th class="l">原因</th></tr></thead><tbody id="closed"></tbody></table></div>
  <h2>規則與下單方式</h2>
  <dl class="help" id="help"></dl>
  <footer id="foot"></footer>
</main>
<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const n = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString("zh-TW", {minimumFractionDigits: d, maximumFractionDigits: d});
  const px = v => n(v, v == null ? 0 : v < 100 ? 2 : v < 1000 ? 1 : 0);
  const pct = (v, d = 1) => v == null ? "–" : `<span class="${v > 0 ? "up" : v < 0 ? "dn" : ""}">${v > 0 ? "+" : ""}${(v * 100).toFixed(d)}%</span>`;
  const sh = (s) => { const lots = Math.floor(s / 1000), odd = s % 1000; return `${n(s)}<span class="s">${lots ? lots + " 張" : ""}${odd ? (lots ? "＋" : "") + odd + " 股零股" : ""}</span>`; };
  const WHY = {stop: "跌破停損", time: "時間停損", regime: "大盤出場", delist: "下市", partial: "停利"};
  fetch("data/strategy/latest.json", {cache: "no-cache"}).then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(d => {
    const S = d.system, A = d.account, M = d.market, P = d.params;
    $("sys").textContent = `${S.key} ${S.name}・${S.status}`;
    $("sys").className = "pill " + (S.status.startsWith("通過") ? "ok" : "no");
    $("date").textContent = `資料 ${d.date}`;
    $("buyTitle").textContent = `明天（${d.next_day}）開盤買`;
    const card = (k, v) => `<div class="card"><span>${k}</span><b>${v}</b></div>`;
    $("cards").innerHTML = card("模擬權益", n(A.equity)) + card("現金", n(A.cash)) + card("持股檔數", `${A.n_pos} / ${P.max_pos}`)
      + card("總未實現風險", `${(A.risk_open_pct * 100).toFixed(1)}% / ${(P.risk_cap * 100).toFixed(0)}%`)
      + card("加權指數 vs 200 日線", `${n(M.twii)} <span class="${M.above_ma200 ? "up" : "dn"}" style="font-size:13px">${M.above_ma200 ? "在上" : "在下"} ${n(M.twii_ma200)}</span>`);
    const sig = d.signals;
    $("sig").innerHTML = sig.length ? sig.map(r => `<tr>
      <td class="l"><b>${esc(r.name)}</b><span class="s">${esc(r.code)}</span></td><td class="l">${esc(r.ind)}</td>
      <td>${n(r.rs_q)}</td><td>${px(r.close)}</td><td>${px(r.one_r)}</td><td>${px(r.stop_est)}</td><td>${sh(r.shares)}</td>
      <td>${pct(r.rev_yoy, 0)}</td><td class="l ${r.buy ? "up" : ""}">${esc(r.status)}</td></tr>`).join("")
      : `<tr><td colspan="9" class="empty">今天收盤沒有股票符合進場條件。${M.above_ma200 ? "" : "加權指數在 200 日線下面，創 250 日新高的股票很少。"}</td></tr>`;
    $("pos").innerHTML = d.positions.length ? d.positions.map(r => `<tr>
      <td class="l"><b>${esc(r.name)}</b><span class="s">${esc(r.code)}・${esc(r.ind)}</span></td><td>${r.entry_date}</td><td>${px(r.entry_px)}</td>
      <td>${sh(r.shares)}</td><td>${px(r.close)}</td><td><b>${px(r.stop)}</b></td><td>${n(r.r_now, 2)}R</td><td>${pct(r.pnl_pct)}</td><td>${r.days}</td>
      <td class="l ${r.exit_next ? "warn" : ""}">${r.exit_next ? "開盤賣（" + esc(r.exit_why) + "）" : "續抱"}</td></tr>`).join("")
      : `<tr><td colspan="10" class="empty">目前沒有模擬持股（模擬從 ${esc(S.go_live)} 開始）。</td></tr>`;
    $("closed").innerHTML = d.closed.length ? d.closed.map(r => `<tr><td class="l"><b>${esc(r.name)}</b><span class="s">${esc(r.code)}</span></td>
      <td>${r.entry_date}</td><td>${r.exit_date}</td><td>${n(r.r_mult, 2)}R</td><td>${n(r.pnl)}</td><td class="l">${esc(WHY[r.why] || r.why)}</td></tr>`).join("")
      : `<tr><td colspan="6" class="empty">還沒有出場紀錄。</td></tr>`;
    const dt = (a, b) => `<dt>${a}</dt><dd>${b}</dd>`;
    $("help").innerHTML =
      dt("進場條件", `收盤創 250 日新高，而且最新一個月營收年增率 &gt; 30%、是近 12 個月最高（月營收在次月 10 日起才算可用）。股票池：普通股、20 日均額 ≥ 1 億、收盤 ≥ 10 元。多個訊號依季 RS 由高到低排。處置股不買。`)
      + dt("隔天怎麼買", `「明天開盤買」狀態是「系統明天開盤買」的那幾檔，用開盤價買進（試撮時掛市價或漲停價的限價單）。開盤就漲停鎖住的不追。建議股數 = 帳戶權益 × ${(P.risk * 100).toFixed(2)}% ÷ 1R，單檔最多權益 ${(P.max_w * 100).toFixed(0)}%；資金不同請改 research/2026-11_cs7_trend_system/daily_config.json 的 capital。`)
      + dt("1R 與初始停損", `1R = ${P.stop_atr} × ATR20（20 日平均真實區間）。初始停損 = 實際成交價 − 1R；表上的「停損（估）」是用今天收盤估的，成交後用實際成交價重算。`)
      + dt("停損怎麼執行", `系統只看收盤：收盤跌破「停損價」，隔天開盤賣。停損價每天收盤後更新：持有期間最高收盤 − ${P.trail_atr} × ATR20，和初始停損取比較高的，只會往上調。盤中跌破不用賣（回測裡盤中觸價停損比較差）。這一頁的「停損價」就是今天收盤後的最新值；「明天」欄寫「開盤賣」的就是今天收盤已經跌破。`)
      + dt("時間停損", `進場後第 ${P.time_stop} 個交易日收盤，持有期間最高收盤還沒到「進場價 + 1R」，隔天開盤賣。`)
      + dt("組合限制", `最多 ${P.max_pos} 檔；新買時，所有部位到停損的距離合計不超過權益 ${(P.risk_cap * 100).toFixed(0)}%；同產業最多 5 檔。名額或風險滿了的訊號會標「沒排進」。`)
      + dt("R 倍數", `（收盤 − 進場價）÷ 1R。+3R 代表賺了三倍的初始風險。`)
      + dt("驗證成績", `CS7 第三階段，2024-01-02 ~ 2026-11-20 只跑一次：年化 +58.1%、最大回撤 −28.3%（0050 含息 +40.8%、−27.5%）。驗證期沒有完整的空頭年；設計期 2022 年是 −31%。勝率約 44%，獲利集中在少數 5 ~ 8R 的交易。`);
    $("foot").textContent = `產生時間 ${d.generated_at}。模擬持股照規則從 ${S.go_live} 開始逐日更新，不是實際帳戶。只用價格、排名、月營收計算。`;
  }).catch(e => { $("cards").innerHTML = `<div class="card">策略資料載入失敗（${esc(e.message)}）</div>`; });
})();
</script>
</body>
</html>
